# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Go projects: formatting, linting, tests, vulnerability scanning and builds in the Go container.
version: '3.53.1'
silent: true

includes:
  docker:
    taskfile: ../docker/Taskfile.yml
    internal: true

vars:
  git_root:
    sh: git rev-parse --show-toplevel

tasks:
  exec:
    desc: Run CMD in the Go container.
    requires:
      vars: [CMD]
    vars:
      context:
        ref: '.TASK_CONTEXT | default .'

      configured_root: '{{.context.PROJECT_ROOT | default .git_root}}'
      project_root:    '{{if isAbs .configured_root}}{{.configured_root}}{{else}}{{joinPath .ROOT_DIR .configured_root | absPath}}{{end}}'
      dir:             '{{.context.GO_DIR | default "."}}'
      version:
        sh: |
          dir={{joinPath .project_root .dir | shellQuote}}
          if [ -n {{.context.GO_IMAGE | default "" | shellQuote}} ]; then
            :
          elif [ -n {{.context.GO_VERSION | default "" | shellQuote}} ]; then
            printf '%s\n' {{.context.GO_VERSION | default "" | shellQuote}}
          elif [ -f "$dir/go.mod" ]; then
            toolchain=$(sed -nE 's/^[[:space:]]*toolchain[[:space:]]+go([^[:space:]]+).*/\1/p' "$dir/go.mod" | head -n 1)
            if [ -n "$toolchain" ]; then
              printf '%s\n' "$toolchain"
            else
              sed -nE 's/^[[:space:]]*go[[:space:]]+([^[:space:]]+).*/\1/p' "$dir/go.mod" | head -n 1
            fi
          fi
      image: '{{.context.GO_IMAGE | default (printf "ghcr.io/mr-chelyshkin/ci/golang:%s" .version)}}'
    preconditions:
      - sh: test -d {{joinPath .project_root .dir | shellQuote}}
        msg: 'Directory does not exist: {{joinPath .project_root .dir}} (PROJECT_ROOT, GO_DIR).'
      - sh: test -n {{.context.GO_IMAGE | default "" | shellQuote}} || printf '%s\n' {{.version | shellQuote}} | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
        msg: Set GO_VERSION (X.Y.Z) or GO_IMAGE, or pin an exact version in go.mod (toolchain goX.Y.Z or go X.Y.Z).
    cmds:
      - task: docker:run
        vars:
          IMAGE:        '{{.image}}'
          CMD:          '{{.CMD}}'
          PROJECT_ROOT: '{{.project_root}}'
          WORKDIR:      '{{.dir}}'
          CACHE_DIR:    '{{.context.GO_CACHE_DIR | default ".cache/go"}}'
          CACHE_TARGET: /tmp/go-cache
          ENVS:
            - GOPATH=/tmp/go-cache/gopath
            - GOCACHE=/tmp/go-cache/build
            - GOMODCACHE=/tmp/go-cache/mod
          TASK_CONTEXT:
            ref: .context

  fmt:
    desc: Check formatting.
    cmds:
      - task: exec
        vars:
          CMD: |
            sh -e -c '
              unformatted=$(gofumpt -l {{.FMT_ARGS | default "."}})
              if [ -n "$unformatted" ]; then
                printf "gofumpt: unformatted files:\n%s\n" "$unformatted" >&2
                exit 1
              fi
            '
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  lint:
    desc: Run linter.
    cmds:
      - task: exec
        vars:
          CMD: 'golangci-lint run {{.LINT_ARGS | default "./..."}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  test:
    desc: Run tests.
    cmds:
      - task: exec
        vars:
          CMD: 'go test {{.TEST_ARGS | default "./..."}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  audit:
    desc: Audit dependencies.
    cmds:
      - task: exec
        vars:
          CMD: 'govulncheck {{.AUDIT_ARGS | default "./..."}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  build:
    desc: Build binary NAME.
    requires:
      vars: [NAME]
    vars:
      build_args:  '{{.BUILD_ARGS  | default "-trimpath -ldflags=\"-s -w\""}}'
      main_pkg:    '{{.MAIN_PKG    | default "./cmd"}}'
      output_dir:  '{{.OUTPUT_DIR  | default "bin"}}'
      go_os:       '{{.GOOS        | default "linux"}}'
      go_arch:     '{{.GOARCH      | default "amd64"}}'
      cgo_enabled: '{{.CGO_ENABLED | default "0"}}'
    cmds:
      - task: exec
        vars:
          CMD: |
            sh -c '
              mkdir -p "$1"
              shift
              exec env "$@"
            ' go-build \
              {{.output_dir | shellQuote}} \
              {{printf "CGO_ENABLED=%s" .cgo_enabled | shellQuote}} \
              {{printf "GOOS=%s" .go_os | shellQuote}} \
              {{printf "GOARCH=%s" .go_arch | shellQuote}} \
              go build {{.build_args}} \
              -o {{printf "%s/%s-%s-%s" .output_dir .NAME .go_os .go_arch | shellQuote}} \
              {{.main_pkg | shellQuote}}
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  fmt/fix:
    desc: Fix formatting.
    cmds:
      - task: exec
        vars:
          CMD: 'gofumpt -w {{.FMT_ARGS | default "."}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  lint/fix:
    desc: Run linter and apply the available fixes.
    cmds:
      - task: exec
        vars:
          CMD: 'golangci-lint run --fix {{.LINT_ARGS | default "./..."}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  tidy:
    desc: Tidy go.mod and go.sum.
    cmds:
      - task: exec
        vars:
          CMD: go mod tidy
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  vendor:
    desc: Vendor dependencies.
    cmds:
      - task: exec
        vars:
          CMD: go mod vendor
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'
