# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'
silent: true

includes:
  docker:
    taskfile: ../docker/Taskfile.yml
    internal: true

vars:
  aws_version: '{{.AWS_VERSION | default "2.36.24"}}'
  image:       '{{if .AWS_IMAGE}}{{.AWS_IMAGE}}{{else}}ghcr.io/soltihq/ci/aws:{{.aws_version}}{{end}}'

tasks:
  # Run an AWS CLI command in container.
  _aws/tool:
    requires:
      vars: [CMD]
    cmds:
      - task: docker:run
        vars:
          IMAGE:     '{{.image}}'
          CMD:       '{{.CMD}}'
          MOUNT_DIR: .

          CONTAINER_ENGINE: '{{.CONTAINER_ENGINE      | default "docker"}}'
          PULL_POLICY:      '{{.CONTAINER_PULL_POLICY | default "missing"}}'
          MOUNT_MODE:       '{{.CONTAINER_MOUNT_MODE  | default "rw"}}'
          CONTAINER_USER:   '{{.CONTAINER_USER        | default "host"}}'
          RUN_ARGS:         '{{.CONTAINER_RUN_ARGS    | default ""}}'
          PORTS:            '{{.CONTAINER_PORTS       | default ""}}'
          EXTRA_ENVS:       '{{.CONTAINER_ENVS        | default ""}}'
          EXTRA_VOLUMES:    '{{.CONTAINER_VOLUMES     | default ""}}'

          ENVS:
            - HOME=/tmp
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - AWS_SESSION_TOKEN
            - AWS_REGION
            - AWS_DEFAULT_REGION
            - '{{if .SOURCE_DIR}}TASKS_SOURCE_DIR={{.SOURCE_DIR}}{{end}}'
            - '{{if .BUCKET}}TASKS_BUCKET={{.BUCKET}}{{end}}'
            - '{{if .IMMUTABLE_CACHE_CONTROL}}TASKS_IMMUTABLE_CACHE_CONTROL={{.IMMUTABLE_CACHE_CONTROL}}{{end}}'
            - '{{if .MUTABLE_CACHE_CONTROL}}TASKS_MUTABLE_CACHE_CONTROL={{.MUTABLE_CACHE_CONTROL}}{{end}}'
            - '{{if .DISTRIBUTION_ID}}TASKS_DISTRIBUTION_ID={{.DISTRIBUTION_ID}}{{end}}'
            - '{{if .INVALIDATION_PATHS}}TASKS_INVALIDATION_PATHS={{.INVALIDATION_PATHS}}{{end}}'

  # Upload a static to S3.
  s3/upload/static:
    requires:
      vars: [SOURCE_DIR, BUCKET]
    vars:
      immutable_cache_control: '{{.IMMUTABLE_CACHE_CONTROL | default "public,max-age=31536000,immutable"}}'
      mutable_cache_control:   '{{.MUTABLE_CACHE_CONTROL   | default "no-cache,no-store,must-revalidate"}}'
    cmds:
      - task: _aws/tool
        vars:
          SOURCE_DIR:              '{{.SOURCE_DIR}}'
          BUCKET:                  '{{.BUCKET}}'
          IMMUTABLE_CACHE_CONTROL: '{{.immutable_cache_control}}'
          MUTABLE_CACHE_CONTROL:   '{{.mutable_cache_control}}'

          CMD: |
            bash -c '
              set -euo pipefail

              source_dir="/workspace/$TASKS_SOURCE_DIR"

              test -d "$source_dir"
              test -f "$source_dir/index.html"

              aws s3 sync \
                "$source_dir" \
                "s3://$TASKS_BUCKET" \
                --exclude "index.html" \
                --cache-control "$TASKS_IMMUTABLE_CACHE_CONTROL" \
                --only-show-errors

              exec aws s3 cp \
                "$source_dir/index.html" \
                "s3://$TASKS_BUCKET/index.html" \
                --cache-control "$TASKS_MUTABLE_CACHE_CONTROL" \
                --content-type "text/html; charset=utf-8" \
                --only-show-errors
            '

  # Create a CloudFront cache invalidation.
  cloudfront/cache/invalidate:
    requires:
      vars: [DISTRIBUTION_ID]
    vars:
      invalidation_paths: '{{.INVALIDATION_PATHS | default "/*"}}'
    cmds:
      - task: _aws/tool
        vars:
          DISTRIBUTION_ID:    '{{.DISTRIBUTION_ID}}'
          INVALIDATION_PATHS: '{{.invalidation_paths}}'

          CMD: |
            bash -c '
              set -euo pipefail

              read -r -a paths <<< "$TASKS_INVALIDATION_PATHS"

              invalidation_id=$(
                aws cloudfront create-invalidation \
                  --distribution-id "$TASKS_DISTRIBUTION_ID" \
                  --paths "${paths[@]}" \
                  --query Invalidation.Id \
                  --output text
              )

              exec aws cloudfront wait invalidation-completed \
                --distribution-id "$TASKS_DISTRIBUTION_ID" \
                --id "$invalidation_id"
            '
