# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Terraform configurations: formatting, validation and plans in the Terraform container.
version: '3.53.1'
silent: true

includes:
  docker:
    taskfile: ../docker/Taskfile.yml
    internal: true

vars:
  git_root:
    sh: git rev-parse --show-toplevel

tasks:
  exec:
    desc: Run CMD in the Terraform container.
    requires:
      vars: [CMD]
    vars:
      context:
        ref: '.TASK_CONTEXT | default .'

      configured_root: '{{.context.PROJECT_ROOT | default .git_root}}'
      project_root:    '{{if isAbs .configured_root}}{{.configured_root}}{{else}}{{joinPath .ROOT_DIR .configured_root | absPath}}{{end}}'
      dir:             '{{.context.TERRAFORM_DIR | default "."}}'
      version:
        sh: |
          dir={{joinPath .project_root .dir | shellQuote}}
          if [ -n {{.context.TERRAFORM_IMAGE | default "" | shellQuote}} ]; then
            :
          elif [ -n {{.context.TERRAFORM_VERSION | default "" | shellQuote}} ]; then
            printf '%s\n' {{.context.TERRAFORM_VERSION | default "" | shellQuote}}
          elif [ -f "$dir/.terraform-version" ]; then
            sed -nE '1s/^[[:space:]]*v?([^[:space:]]+).*/\1/p' "$dir/.terraform-version"
          else
            printf '%s\n' 1.15.9
          fi
      image: '{{.context.TERRAFORM_IMAGE | default (printf "ghcr.io/mr-chelyshkin/ci/terraform:%s" .version)}}'
    preconditions:
      - sh: test -d {{joinPath .project_root .dir | shellQuote}}
        msg: 'Directory does not exist: {{joinPath .project_root .dir}} (PROJECT_ROOT, TERRAFORM_DIR).'
      - sh: test -n {{.context.TERRAFORM_IMAGE | default "" | shellQuote}} || printf '%s\n' {{.version | shellQuote}} | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
        msg: Set TERRAFORM_VERSION (X.Y.Z) or TERRAFORM_IMAGE, or pin an exact version in .terraform-version.
    cmds:
      - task: docker:run
        vars:
          IMAGE:        '{{.image}}'
          CMD:          '{{.CMD}}'
          PROJECT_ROOT: '{{.project_root}}'
          WORKDIR:      '{{.dir}}'
          CACHE_DIR:    '{{.context.TERRAFORM_CACHE_DIR | default ".cache/terraform"}}'
          CACHE_TARGET: /tmp/terraform-cache
          ENVS:
            - CHECKPOINT_DISABLE=1
            - TF_IN_AUTOMATION=1
            - TF_PLUGIN_CACHE_DIR=/tmp/terraform-cache
          TASK_CONTEXT:
            ref: .context

  fmt:
    desc: Check formatting.
    cmds:
      - task: exec
        vars:
          CMD: 'terraform fmt -check -diff {{.FMT_ARGS | default "-recursive"}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  fmt/fix:
    desc: Fix formatting.
    cmds:
      - task: exec
        vars:
          CMD: 'terraform fmt {{.FMT_ARGS | default "-recursive"}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  validate:
    desc: Validate the configuration.
    cmds:
      - task: _init
        vars:
          INIT_ARGS: '{{.INIT_ARGS | default "-backend=false -input=false -lockfile=readonly"}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'
      - task: exec
        vars:
          CMD: 'terraform validate {{.VALIDATE_ARGS | default "-no-color"}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  plan:
    desc: Create an execution plan.
    cmds:
      - task: _init
        vars:
          INIT_ARGS: '{{.INIT_ARGS | default "-input=false -lockfile=readonly"}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'
      - task: exec
        vars:
          CMD: 'terraform plan {{.PLAN_ARGS | default "-input=false -lock-timeout=5m -no-color"}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  _init:
    internal: true
    requires:
      vars: [INIT_ARGS]
    cmds:
      - task: exec
        vars:
          CMD: 'terraform init {{.INIT_ARGS}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'
