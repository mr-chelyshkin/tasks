# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Python projects (uv): formatting, linting, tests, audits, type checks and packaging in the Python container.
version: '3.53.1'
silent: true

includes:
  docker:
    taskfile: ../docker/Taskfile.yml
    internal: true

vars:
  git_root:
    sh: git rev-parse --show-toplevel

tasks:
  exec:
    desc: Run CMD in the Python container.
    requires:
      vars: [CMD]
    vars:
      context:
        ref: '.TASK_CONTEXT | default .'

      configured_root: '{{.context.PROJECT_ROOT | default .git_root}}'
      project_root:    '{{if isAbs .configured_root}}{{.configured_root}}{{else}}{{joinPath .ROOT_DIR .configured_root | absPath}}{{end}}'
      dir:             '{{.context.PYTHON_DIR | default "."}}'
      version:
        sh: |
          dir={{joinPath .project_root .dir | shellQuote}}
          if [ -n {{.context.PYTHON_IMAGE | default "" | shellQuote}} ]; then
            :
          elif [ -n {{.context.PYTHON_VERSION | default "" | shellQuote}} ]; then
            printf '%s\n' {{.context.PYTHON_VERSION | default "" | shellQuote}}
          elif [ -f "$dir/.python-version" ]; then
            sed -nE '1s/^[[:space:]]*([^[:space:]]+).*/\1/p' "$dir/.python-version"
          fi
      image: '{{.context.PYTHON_IMAGE | default (printf "ghcr.io/mr-chelyshkin/ci/python:%s" .version)}}'
    preconditions:
      - sh: test -d {{joinPath .project_root .dir | shellQuote}}
        msg: 'Directory does not exist: {{joinPath .project_root .dir}} (PROJECT_ROOT, PYTHON_DIR).'
      - sh: test -n {{.context.PYTHON_IMAGE | default "" | shellQuote}} || printf '%s\n' {{.version | shellQuote}} | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
        msg: Set PYTHON_VERSION (X.Y.Z) or PYTHON_IMAGE, or pin an exact version in .python-version.
    cmds:
      - task: docker:run
        vars:
          IMAGE:        '{{.image}}'
          CMD:          '{{.CMD}}'
          PROJECT_ROOT: '{{.project_root}}'
          WORKDIR:      '{{.dir}}'
          CACHE_DIR:    '{{.context.PYTHON_CACHE_DIR | default ".cache/python"}}'
          CACHE_TARGET: /tmp/python-cache
          ENVS:
            - UV_PROJECT_ENVIRONMENT=/tmp/python-venv
            - UV_CACHE_DIR=/tmp/python-cache/uv
            - UV_PYTHON_DOWNLOADS=never
            - UV_LINK_MODE=copy
            - RUFF_CACHE_DIR=/tmp/python-cache/ruff
            - MYPY_CACHE_DIR=/tmp/python-cache/mypy
            - PYTHONDONTWRITEBYTECODE=1
          TASK_CONTEXT:
            ref: .context

  fmt:
    desc: Check formatting.
    cmds:
      - task: exec
        vars:
          CMD: 'uv run --locked ruff format --check {{.FMT_ARGS | default "."}}'
          TASK_CONTEXT:
            ref: 'merge (dict "CONTAINER_MOUNT_MODE" "ro") (.TASK_CONTEXT | default .)'

  lint:
    desc: Run linter.
    cmds:
      - task: exec
        vars:
          CMD: 'uv run --locked ruff check {{.LINT_ARGS | default "."}}'
          TASK_CONTEXT:
            ref: 'merge (dict "CONTAINER_MOUNT_MODE" "ro") (.TASK_CONTEXT | default .)'

  test:
    desc: Run tests.
    cmds:
      - task: exec
        vars:
          CMD: 'uv run --locked pytest -o cache_dir=/tmp/python-cache/pytest {{.TEST_ARGS}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  audit:
    desc: Audit dependencies.
    cmds:
      - task: exec
        vars:
          CMD: 'uv audit --locked {{.AUDIT_ARGS}}'
          TASK_CONTEXT:
            ref: 'merge (dict "CONTAINER_MOUNT_MODE" "ro") (.TASK_CONTEXT | default .)'

  typecheck:
    desc: Check types.
    cmds:
      - task: exec
        vars:
          CMD: 'uv run --locked mypy {{.TYPECHECK_ARGS}}'
          TASK_CONTEXT:
            ref: 'merge (dict "CONTAINER_MOUNT_MODE" "ro") (.TASK_CONTEXT | default .)'

  build:
    desc: Build sdist and wheel.
    vars:
      output_dir: '{{.OUTPUT_DIR | default "dist"}}'
    cmds:
      - task: exec
        vars:
          CMD: |
            sh -eu -c '
              uv lock --check
              exec uv build --no-sources --clear --out-dir "$1"
            ' python-build {{.output_dir | shellQuote}}
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  fmt/fix:
    desc: Fix formatting.
    cmds:
      - task: exec
        vars:
          CMD: 'uv run --locked ruff format {{.FMT_ARGS | default "."}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  lint/fix:
    desc: Run linter and apply the available fixes.
    cmds:
      - task: exec
        vars:
          CMD: 'uv run --locked ruff check --fix {{.LINT_ARGS | default "."}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  package/check:
    desc: Smoke-test the built wheel with PACKAGE_COMMAND.
    requires:
      vars: [PACKAGE_COMMAND]
    vars:
      output_dir: '{{.OUTPUT_DIR | default "dist"}}'
    cmds:
      - task: exec
        vars:
          CMD: |
            sh -eu -c '
              artifact_dir=$1
              shift
              count=0
              wheel=""
              for candidate in "$artifact_dir"/*.whl; do
                [ -f "$candidate" ] || continue
                wheel=$candidate
                count=$((count + 1))
              done
              if [ "$count" -ne 1 ]; then
                printf "Expected one wheel in %s; found %s. Run the build task first.\n" "$artifact_dir" "$count" >&2
                exit 1
              fi

              uv venv /tmp/python-package-check
              uv pip install --python /tmp/python-package-check/bin/python "$wheel"
              cd /tmp
              export PATH="/tmp/python-package-check/bin:$PATH"
              exec "$@"
            ' python-package-check {{.output_dir | shellQuote}} {{range (.PACKAGE_COMMAND | splitArgs)}}{{. | shellQuote}} {{end}}
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  tag/check:
    desc: Check that RELEASE_TAG matches the package version.
    requires:
      vars: [RELEASE_TAG]
    cmds:
      - task: exec
        vars:
          CMD: |
            python -c '
            import sys
            import tomllib
            from pathlib import Path

            project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
            expected = "v" + project["version"]
            actual = sys.argv[1]
            if actual != expected:
                sys.exit(f"Release tag {actual!r} does not match package version {expected!r}")
            print(f"Release tag matches package version: {expected}")
            ' {{.RELEASE_TAG | shellQuote}}
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'
