# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Markdown: formatting with mdformat and GitHub Flavored Markdown support in the Markdown container.
version: '3.53.1'
silent: true

includes:
  docker:
    taskfile: ../docker/Taskfile.yml
    internal: true

vars:
  git_root:
    sh: git rev-parse --show-toplevel

tasks:
  exec:
    desc: Run CMD in the Markdown container.
    requires:
      vars: [CMD]
    vars:
      context:
        ref: '.TASK_CONTEXT | default .'

      configured_root: '{{.context.PROJECT_ROOT | default .git_root}}'
      project_root:    '{{if isAbs .configured_root}}{{.configured_root}}{{else}}{{joinPath .ROOT_DIR .configured_root | absPath}}{{end}}'
      dir:             '{{.context.MARKDOWN_DIR | default "."}}'
      version:         '{{.context.MARKDOWN_VERSION | default "1.0.0"}}'
      image:           '{{.context.MARKDOWN_IMAGE | default (printf "ghcr.io/mr-chelyshkin/ci/markdown:%s" .version)}}'
    preconditions:
      - sh: test -d {{joinPath .project_root .dir | shellQuote}}
        msg: 'Directory does not exist: {{joinPath .project_root .dir}} (PROJECT_ROOT, MARKDOWN_DIR).'
      - sh: test -n {{.context.MARKDOWN_IMAGE | default "" | shellQuote}} || printf '%s\n' {{.version | shellQuote}} | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
        msg: Set MARKDOWN_VERSION (X.Y.Z) or MARKDOWN_IMAGE.
    cmds:
      - task: docker:run
        vars:
          IMAGE:        '{{.image}}'
          CMD:          '{{.CMD}}'
          PROJECT_ROOT: '{{.project_root}}'
          WORKDIR:      '{{.dir}}'
          TASK_CONTEXT:
            ref: .context

  fmt:
    desc: Check formatting.
    cmds:
      - task: exec
        vars:
          CMD: 'mdformat --check {{.FMT_ARGS | default "."}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  fmt/fix:
    desc: Fix formatting.
    cmds:
      - task: exec
        vars:
          CMD: 'mdformat {{.FMT_ARGS | default "."}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'
