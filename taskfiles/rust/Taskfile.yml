# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Rust projects: formatting, linting, tests, audits, documentation and builds in the Rust container.
version: '3.53.1'
silent: true

includes:
  docker:
    taskfile: ../docker/Taskfile.yml
    internal: true

vars:
  git_root:
    sh: git rev-parse --show-toplevel

tasks:
  exec:
    desc: Run CMD in the Rust container.
    requires:
      vars: [CMD]
    vars:
      context:
        ref: '.TASK_CONTEXT | default .'

      configured_root: '{{.context.PROJECT_ROOT | default .git_root}}'
      project_root:    '{{if isAbs .configured_root}}{{.configured_root}}{{else}}{{joinPath .ROOT_DIR .configured_root | absPath}}{{end}}'
      dir:             '{{.context.RUST_DIR | default "."}}'
      version:
        sh: |
          dir={{joinPath .project_root .dir | shellQuote}}
          if [ -n {{.context.RUST_IMAGE | default "" | shellQuote}} ]; then
            :
          elif [ -n {{.context.RUST_VERSION | default "" | shellQuote}} ]; then
            printf '%s\n' {{.context.RUST_VERSION | default "" | shellQuote}}
          elif [ -f "$dir/rust-toolchain.toml" ]; then
            sed -nE "s/^[[:space:]]*channel[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*/\1/p" "$dir/rust-toolchain.toml" | head -n 1
          fi
      image: '{{.context.RUST_IMAGE | default (printf "ghcr.io/mr-chelyshkin/ci/rust:%s" .version)}}'

      rust_flags:    '{{.RUSTFLAGS    | default .context.RUSTFLAGS    | default "-D warnings"}}'
      rustdoc_flags: '{{.RUSTDOCFLAGS | default .context.RUSTDOCFLAGS | default ""}}'
    preconditions:
      - sh: test -d {{joinPath .project_root .dir | shellQuote}}
        msg: 'Directory does not exist: {{joinPath .project_root .dir}} (PROJECT_ROOT, RUST_DIR).'
      - sh: test -n {{.context.RUST_IMAGE | default "" | shellQuote}} || printf '%s\n' {{.version | shellQuote}} | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
        msg: Set RUST_VERSION (X.Y.Z) or RUST_IMAGE, or pin an exact channel in rust-toolchain.toml.
    cmds:
      - task: docker:run
        vars:
          IMAGE:        '{{.image}}'
          CMD:          '{{.CMD}}'
          PROJECT_ROOT: '{{.project_root}}'
          WORKDIR:      '{{.dir}}'
          CACHE_DIR:    '{{.context.RUST_CACHE_DIR | default ".cache/rust"}}'
          CACHE_TARGET: /tmp/rust-cache
          ENVS:
            - CARGO_TARGET_DIR=/tmp/rust-cache/target
            - CARGO_HOME=/tmp/rust-cache/cargo
            - RUSTUP_NO_UPDATE_CHECK=1
            - CARGO_INCREMENTAL=0
            - RUSTFLAGS={{.rust_flags}}
            - '{{if .version}}RUSTUP_TOOLCHAIN={{.version}}{{end}}'
            - '{{if .rustdoc_flags}}RUSTDOCFLAGS={{.rustdoc_flags}}{{end}}'
          TASK_CONTEXT:
            ref: .context

  fmt:
    desc: Check formatting.
    cmds:
      - task: exec
        vars:
          CMD: 'cargo fmt --check {{.FMT_ARGS | default "--all"}}'
          TASK_CONTEXT:
            ref: 'merge (dict "CONTAINER_MOUNT_MODE" "ro") (.TASK_CONTEXT | default .)'

  lint:
    desc: Run linter.
    cmds:
      - task: exec
        vars:
          CMD: 'cargo clippy {{.LINT_ARGS | default "--workspace --all-features --locked -- -D warnings"}}'
          TASK_CONTEXT:
            ref: 'merge (dict "CONTAINER_MOUNT_MODE" "ro") (.TASK_CONTEXT | default .)'

  test:
    desc: Run tests.
    cmds:
      - task: exec
        vars:
          CMD: 'cargo test {{.TEST_ARGS | default "--workspace --all-features --locked"}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  audit:
    desc: Audit dependencies.
    cmds:
      - task: exec
        vars:
          CMD: 'cargo audit {{.AUDIT_ARGS}}'
          TASK_CONTEXT:
            ref: 'merge (dict "CONTAINER_MOUNT_MODE" "ro") (.TASK_CONTEXT | default .)'

  docs:
    desc: Build documentation.
    cmds:
      - task: exec
        vars:
          RUSTDOCFLAGS: -D warnings
          CMD:          'cargo doc {{.DOCS_ARGS | default "--locked"}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  build:
    desc: Build crate CRATE.
    requires:
      vars: [CRATE]
    cmds:
      - task: exec
        vars:
          CMD: 'cargo build -p {{.CRATE | shellQuote}} {{.BUILD_ARGS | default "--locked"}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  fmt/fix:
    desc: Fix formatting.
    cmds:
      - task: exec
        vars:
          CMD: 'cargo fmt {{.FMT_ARGS | default "--all"}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  lint/fix:
    desc: Run linter and apply the available fixes.
    cmds:
      - task: exec
        vars:
          CMD: 'cargo clippy --fix --allow-dirty --allow-staged {{.LINT_ARGS | default "--workspace --all-features --locked -- -D warnings"}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  audit/fix:
    desc: Upgrade vulnerable dependencies.
    cmds:
      - task: exec
        vars:
          CMD: 'cargo audit fix {{.AUDIT_ARGS}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  check:
    desc: Check that the code compiles.
    cmds:
      - task: exec
        vars:
          CMD: 'cargo check {{.CHECK_ARGS | default "--locked"}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  bench:
    desc: Run benchmarks.
    cmds:
      - task: exec
        vars:
          CMD: 'cargo bench {{.BENCH_ARGS | default "--locked"}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  # Unpinned on purpose: docs.rs builds with the latest nightly, so this check must too.
  docs/nightly:
    desc: Build documentation as docs.rs does.
    vars:
      manifest_path: '{{if .MANIFEST_PATH}}{{.MANIFEST_PATH}}{{else if .CRATE}}crates/{{.CRATE}}/Cargo.toml{{else}}Cargo.toml{{end}}'
    cmds:
      - task: exec
        vars:
          RUSTFLAGS: --cap-lints warn
          CMD: >-
            sh -eu -c 'exec cargo +"$RUST_VERSION" rustdoc "$@"' cargo-rustdoc
            --lib
            --manifest-path {{.manifest_path | shellQuote}}
            {{.DOCS_NIGHTLY_ARGS | default "--all-features"}}
            -Zrustdoc-map
            -Zunstable-options
            -Zrustdoc-scrape-examples
            --config 'build.rustdocflags=["--cfg","docsrs","-Z","unstable-options","--cap-lints","warn"]'
          TASK_CONTEXT:
            ref: 'merge (dict) (.TASK_CONTEXT | default .) (dict "RUST_IMAGE" "rustlang/rust:nightly" "RUST_VERSION" "" "CONTAINER_PULL_POLICY" "always")'

  package/list:
    desc: List the files in the CRATE package.
    requires:
      vars: [CRATE]
    cmds:
      - task: exec
        vars:
          CMD: 'cargo package --list -p {{.CRATE | shellQuote}} {{.PACKAGE_LIST_ARGS | default "--locked"}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  publish/dry-run:
    desc: Check that CRATE can be published.
    requires:
      vars: [CRATE]
    cmds:
      - task: exec
        vars:
          CMD: 'cargo publish --dry-run -p {{.CRATE | shellQuote}} {{.PUBLISH_DRY_RUN_ARGS | default "--all-features --locked"}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'
