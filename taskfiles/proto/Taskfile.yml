# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Protobuf schemas: formatting, linting, builds and breaking-change checks in the Protobuf container.
version: '3.53.1'
silent: true

includes:
  docker:
    taskfile: ../docker/Taskfile.yml
    internal: true

vars:
  git_root:
    sh: git rev-parse --show-toplevel

tasks:
  exec:
    desc: Run CMD in the Protobuf container.
    requires:
      vars: [CMD]
    vars:
      context:
        ref: '.TASK_CONTEXT | default .'

      configured_root: '{{.context.PROJECT_ROOT | default .git_root}}'
      project_root:    '{{if isAbs .configured_root}}{{.configured_root}}{{else}}{{joinPath .ROOT_DIR .configured_root | absPath}}{{end}}'
      dir:             '{{.context.PROTO_DIR | default "."}}'
      version:         '{{.context.PROTO_VERSION | default "1.50.0"}}'
      image:           '{{.context.PROTO_IMAGE | default (printf "ghcr.io/mr-chelyshkin/ci/proto:%s" .version)}}'
    preconditions:
      - sh: test -d {{joinPath .project_root .dir | shellQuote}}
        msg: 'Directory does not exist: {{joinPath .project_root .dir}} (PROJECT_ROOT, PROTO_DIR).'
      - sh: test -n {{.context.PROTO_IMAGE | default "" | shellQuote}} || printf '%s\n' {{.version | shellQuote}} | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
        msg: Set PROTO_VERSION (X.Y.Z) or PROTO_IMAGE.
    cmds:
      - task: docker:run
        vars:
          IMAGE:        '{{.image}}'
          CMD:          '{{.CMD}}'
          PROJECT_ROOT: '{{.project_root}}'
          WORKDIR:      '{{.dir}}'
          TASK_CONTEXT:
            ref: .context

  fmt:
    desc: Check formatting.
    cmds:
      - task: exec
        vars:
          CMD: |
            sh -e -c '
              git rev-parse --is-inside-work-tree > /dev/null
              git ls-files -z --cached --others --exclude-standard -- "*.proto" |
                xargs -0 -r clang-format --dry-run --Werror "$@"
            ' clang-format {{.FMT_ARGS}}
          TASK_CONTEXT:
            ref: 'merge (dict "CONTAINER_MOUNT_MODE" "ro") (.TASK_CONTEXT | default .)'

  lint:
    desc: Run linter.
    cmds:
      - task: exec
        vars:
          CMD: 'buf lint {{.LINT_ARGS}}'
          TASK_CONTEXT:
            ref: 'merge (dict "CONTAINER_MOUNT_MODE" "ro") (.TASK_CONTEXT | default .)'

  build:
    desc: Build the schema.
    cmds:
      - task: exec
        vars:
          CMD: 'buf build {{.BUILD_ARGS}}'
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  fmt/fix:
    desc: Fix formatting.
    cmds:
      - task: exec
        vars:
          CMD: |
            sh -e -c '
              git rev-parse --is-inside-work-tree > /dev/null
              git ls-files -z --cached --others --exclude-standard -- "*.proto" |
                xargs -0 -r clang-format -i "$@"
            ' clang-format {{.FMT_ARGS}}
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  breaking:
    desc: Check for breaking changes.
    cmds:
      - task: exec
        vars:
          CMD: |
            sh -e -c '
              against=$1
              branch=$2
              shift 2
              if [ -z "$against" ]; then
                root=$(git rev-parse --show-toplevel)
                subdir=$(git rev-parse --show-prefix)
                against="$root/.git#branch=$branch${subdir:+,subdir=${subdir%/}}"
              fi
              exec buf breaking --against "$against" "$@"
            ' buf-breaking {{.AGAINST | default "" | shellQuote}} {{.DEFAULT_BRANCH | default "main" | shellQuote}} {{.BREAKING_ARGS}}
          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'
