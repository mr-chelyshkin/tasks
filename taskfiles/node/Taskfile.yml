# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'
silent: true

includes:
  docker:
    taskfile: ../docker/Taskfile.yml
    internal: true

vars:
  git_root:
    sh: git rev-parse --show-toplevel

tasks:
  # Run npm command in container.
  _npm/tool:
    requires:
      vars: [CMD]
    vars:
      context:
        ref: '.TASK_CONTEXT | default .'

      project_root: '{{.context.PROJECT_ROOT   | default .git_root}}'
      node_version: '{{.context.NODE_VERSION   | default "22.23.1"}}'
      app_dir:      '{{.context.APP_DIR        | default "app"}}'
      cache_dir:    '{{.context.NODE_CACHE_DIR | default ".cache/node"}}'

      image: '{{if .context.NODE_IMAGE}}{{.context.NODE_IMAGE}}{{else}}ghcr.io/soltihq/ci/node:{{.node_version}}{{end}}'
    cmds:
      - mkdir -p {{printf "%s/%s" .project_root .cache_dir | shellQuote}}
      - task: docker:run
        vars:
          IMAGE:        '{{.image}}'
          CMD:          '{{.CMD}}'
          PROJECT_ROOT: '{{.project_root}}'
          WORKDIR:      '/workspace/{{.app_dir}}'
          MOUNT_DIR:    .
          MOUNT_TARGET: /workspace

          CONTAINER_ENGINE: '{{.context.CONTAINER_ENGINE      | default ""}}'
          PULL_POLICY:      '{{.context.CONTAINER_PULL_POLICY | default ""}}'
          CONTAINER_USER:   '{{.context.CONTAINER_USER        | default ""}}'
          MOUNT_MODE:       '{{.context.CONTAINER_MOUNT_MODE  | default ""}}'
          RUN_ARGS:         '{{.context.CONTAINER_RUN_ARGS    | default ""}}'
          PORTS:            '{{.context.CONTAINER_PORTS       | default ""}}'
          EXTRA_ENVS:       '{{.context.CONTAINER_ENVS        | default ""}}'
          EXTRA_VOLUMES:    '{{.context.CONTAINER_VOLUMES     | default ""}}'

          VOLUMES:
            - '{{.project_root}}/{{.cache_dir}}:/tmp/npm-cache:rw'

          ENVS:
            - HOME=/tmp
            - NPM_CONFIG_CACHE=/tmp/npm-cache
            - NPM_CONFIG_UPDATE_NOTIFIER=false

  # Run npm script.
  run:
    requires:
      vars: [SCRIPT]
    cmds:
      - task: _npm/tool
        vars:
          CMD: |
            sh -c '
              npm ci && exec npm run "$1"
            ' npm {{.SCRIPT | shellQuote}}

          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'

  # Run npm audit.
  audit:
    vars:
      audit_level: '{{.AUDIT_LEVEL | default "high"}}'
    cmds:
      - task: _npm/tool
        vars:
          CMD: |
            sh -c '
              npm ci && exec npm audit --audit-level "$1"
            ' npm {{.audit_level | shellQuote}}

          TASK_CONTEXT:
            ref: '.TASK_CONTEXT | default .'
