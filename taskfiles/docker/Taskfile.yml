# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Shared container runner. Tool modules decide what to run; this file decides how.
version: '3.53.1'
silent: true

tasks:
  run:
    desc: Run CMD in IMAGE with PROJECT_ROOT mounted at /workspace.
    requires:
      vars: [IMAGE, CMD, PROJECT_ROOT]
    vars:
      context:
        ref: '.TASK_CONTEXT | default .'

      engine:        '{{.context.CONTAINER_ENGINE      | default "docker"}}'
      pull_policy:   '{{.context.CONTAINER_PULL_POLICY | default "missing"}}'
      mount_mode:    '{{.context.CONTAINER_MOUNT_MODE  | default "rw"}}'
      user:          '{{.context.CONTAINER_USER        | default "host"}}'
      run_args:      '{{.context.CONTAINER_RUN_ARGS    | default ""}}'
      ports:         '{{.context.CONTAINER_PORTS       | default ""}}'
      extra_envs:    '{{.context.CONTAINER_ENVS        | default ""}}'
      extra_volumes: '{{.context.CONTAINER_VOLUMES     | default ""}}'

      workdir:   '{{.WORKDIR   | default "."}}'
      cache_dir: '{{.CACHE_DIR | default ""}}'
    preconditions:
      - sh: test -d {{.PROJECT_ROOT | shellQuote}}
        msg: 'PROJECT_ROOT does not exist or is not a directory: {{.PROJECT_ROOT}}'
      - sh: test -z {{.cache_dir | shellQuote}} || test -n {{.CACHE_TARGET | default "" | shellQuote}}
        msg: CACHE_DIR requires CACHE_TARGET.
    cmds:
      - |
        set -eu

        project_root=$(cd {{.PROJECT_ROOT | shellQuote}} && pwd -P)

        require_inside() {
          case "$2" in
            "$project_root"|"$project_root"/*)
              ;;
            *)
              printf '%s is outside PROJECT_ROOT: %s\n' "$1" "$2" >&2
              exit 2
              ;;
          esac
        }

        workdir=$(cd "$project_root" && cd {{.workdir | shellQuote}} && pwd -P)
        require_inside WORKDIR "$workdir"

        mount_mode={{.mount_mode | shellQuote}}
        pull_policy={{.pull_policy | shellQuote}}
        container_user={{.user | shellQuote}}

        case "$mount_mode" in
          ro|rw)
            ;;
          *)
            printf 'invalid CONTAINER_MOUNT_MODE: %s\n' "$mount_mode" >&2
            exit 2
            ;;
        esac

        case "$pull_policy" in
          always|missing|never)
            ;;
          *)
            printf 'invalid CONTAINER_PULL_POLICY: %s\n' "$pull_policy" >&2
            exit 2
            ;;
        esac

        set -- {{.engine | shellQuote}} run "--pull=$pull_policy" \
          --rm --init \
          --security-opt no-new-privileges \
          --cap-drop ALL

        case "$container_user" in
          host)
            set -- "$@" --user "$(id -u):$(id -g)"
            ;;
          image)
            ;;
          *)
            set -- "$@" --user "$container_user"
            ;;
        esac

        set -- "$@" --volume "$project_root:/workspace:$mount_mode"
        {{if .cache_dir}}
        mkdir -p "$project_root"/{{.cache_dir | shellQuote}}
        cache_path=$(cd "$project_root" && cd {{.cache_dir | shellQuote}} && pwd -P)
        require_inside CACHE_DIR "$cache_path"
        set -- "$@" --volume "$cache_path:"{{.CACHE_TARGET | shellQuote}}":rw"
        {{end}}
        {{range (.extra_volumes | splitArgs)}}
        set -- "$@" --volume {{. | shellQuote}}
        {{end}}

        set -- "$@" --env HOME=/tmp
        {{range .ENVS}}
        {{if .}}
        set -- "$@" --env {{. | shellQuote}}
        {{end}}
        {{end}}
        {{range .ENV_PREFIXES}}
        for name in $(env | sed -n 's/^\({{.}}[A-Za-z0-9_]*\)=.*/\1/p'); do
          set -- "$@" --env "$name"
        done
        {{end}}
        {{range (.extra_envs | splitArgs)}}
        set -- "$@" --env {{. | shellQuote}}
        {{end}}

        {{range (.ports | splitArgs)}}
        set -- "$@" --publish {{. | shellQuote}}
        {{end}}
        {{range (.run_args | splitArgs)}}
        set -- "$@" {{. | shellQuote}}
        {{end}}

        set -- "$@" --workdir "/workspace${workdir#"$project_root"}" {{.IMAGE | shellQuote}}
        {{range (.CMD | splitArgs)}}
        set -- "$@" {{. | shellQuote}}
        {{end}}

        exec "$@"
